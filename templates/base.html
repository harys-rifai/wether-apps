<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI-Weather Alert Center{% endblock %}</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(17, 24, 39, 0.7);
            --accent-color: #00d2ff;
            --accent-glow: 0 0 15px rgba(0, 210, 255, 0.4);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border-color: rgba(0, 210, 255, 0.15);
            --border-glow: 0 0 10px rgba(0, 210, 255, 0.1);
            --danger-color: #ff3860;
            --danger-glow: 0 0 15px rgba(255, 56, 96, 0.4);
            --success-color: #23d160;
            --success-glow: 0 0 15px rgba(35, 209, 96, 0.4);
            --sidebar-width: 280px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 210, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(0, 80, 255, 0.08) 0px, transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Modern Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 210, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-color);
        }

        /* Message Notifications / Toasts */
        .messages-container {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 400px;
            width: calc(100% - 48px);
        }

        .alert-toast {
            padding: 16px 20px;
            border-radius: 12px;
            background: rgba(17, 24, 39, 0.9);
            border-left: 4px solid var(--accent-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), var(--border-glow);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            backdrop-filter: blur(10px);
            animation: slideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        .alert-toast.error {
            border-left-color: var(--danger-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 10px rgba(255, 56, 96, 0.15);
        }

        .alert-toast.success {
            border-left-color: var(--success-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 10px rgba(35, 209, 96, 0.15);
        }

        .alert-toast.info {
            border-left-color: var(--accent-color);
        }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .toast-content i {
            font-size: 1.2rem;
        }

        .alert-toast.success .toast-content i { color: var(--success-color); }
        .alert-toast.error .toast-content i { color: var(--danger-color); }
        .alert-toast.info .toast-content i { color: var(--accent-color); }

        .toast-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .toast-close:hover {
            color: var(--text-primary);
        }

        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes fadeOut {
            to {
                transform: translateY(-20px);
                opacity: 0;
            }
        }

        /* Glassmorphism styling helpers */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: var(--border-glow);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-color), #0050ff);
            color: #0b0f19;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.9rem;
            box-shadow: var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
            filter: brightness(1.1);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Forms Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: rgba(17, 24, 39, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
            background: rgba(17, 24, 39, 0.8);
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    
    <!-- Messages Notification container -->
    <div class="messages-container" id="toast-container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert-toast {{ message.tags }}" id="toast-{{ forloop.counter }}">
                    <div class="toast-content">
                        {% if message.tags == 'success' %}
                            <i class="fa-solid fa-circle-check"></i>
                        {% elif message.tags == 'error' %}
                            <i class="fa-solid fa-circle-exclamation"></i>
                        {% else %}
                            <i class="fa-solid fa-circle-info"></i>
                        {% endif %}
                        <span>{{ message }}</span>
                    </div>
                    <button class="toast-close" onclick="closeToast('toast-{{ forloop.counter }}')">&times;</button>
                </div>
            {% endfor %}
        {% endif %}
    </div>

    {% block content %}
    {% endblock %}

    <script>
        // Automatic dismiss for notifications
        document.addEventListener('DOMContentLoaded', () => {
            const toasts = document.querySelectorAll('.alert-toast');
            toasts.forEach(toast => {
                setTimeout(() => {
                    closeToast(toast.id);
                }, 5000);
            });
        });

        function closeToast(id) {
            const toast = document.getElementById(id);
            if (toast) {
                toast.style.animation = 'fadeOut 0.3s forwards';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
